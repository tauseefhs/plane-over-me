<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Plane Over Me</title>
<style>
  :root {
    --bg: #0e1013; --panel: #16191e; --line: #262a31; --text: #e6e8eb;
    --muted: #8a9099; --ok: #2fbf71; --warn: #f0a020; --bad: #ff4d4d;
    --accent: #ffb000; --cyan: #33c6ff;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  main { max-width: 1180px; margin: 0 auto; padding: 20px 16px 40px; }
  header { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; margin-bottom: 14px; }
  h1 { font-size: 18px; margin: 0; letter-spacing: .02em; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 0 0 10px; font-weight: 600; }
  .pill { font-size: 12px; padding: 2px 9px; border-radius: 99px; border: 1px solid var(--line); color: var(--muted); }
  .pill.ok { color: var(--ok); border-color: #1f5b3b; }
  .pill.bad { color: var(--bad); border-color: #6b2525; }

  .led-wrap {
    background: #050505; border-radius: 14px; padding: 18px;
    border: 1px solid var(--line); box-shadow: 0 10px 40px rgba(0,0,0,.5);
  }
  #led { display: block; width: 100%; height: auto; image-rendering: pixelated; }
  .now { margin: 12px 2px 22px; color: var(--muted); min-height: 1.4em; }
  .now b { color: var(--text); }

  .grid { display: grid; grid-template-columns: 340px 1fr; gap: 18px; }
  @media (max-width: 860px) { .grid { grid-template-columns: 1fr; } }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px; min-width: 0; }
  #radar { width: 100%; height: auto; display: block; }
  .legend { display: flex; gap: 12px; flex-wrap: wrap; font-size: 12px; color: var(--muted); margin-top: 8px; }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 5px; vertical-align: 0; }

  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; white-space: nowrap; }
  th { text-align: left; color: var(--muted); font-weight: 500; padding: 6px 8px; border-bottom: 1px solid var(--line); }
  td { padding: 6px 8px; border-bottom: 1px solid #1d2026; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  tr.rejected td { color: var(--muted); }
  tr.selected td { background: rgba(255,176,0,.09); }
  .tag { font-size: 11px; padding: 1px 7px; border-radius: 99px; }
  .tag.shown { background: var(--accent); color: #000; }
  .tag.ok { color: var(--ok); border: 1px solid #1f5b3b; }
  .tag.cool { color: var(--cyan); border: 1px solid #1d4a5e; }
  .tag.wl { color: var(--accent); border: 1px solid #6a4a00; }
  .tag.em { background: var(--bad); color: #fff; }
  .why { color: var(--muted); font-size: 12px; white-space: normal; }
  .up { color: var(--ok); } .down { color: var(--warn); }
  .history { font-size: 12px; color: var(--muted); margin-top: 12px; }
  .history div { padding: 2px 0; }
</style>
</head>
<body>
<main>
  <header>
    <h1>Plane Over Me</h1>
    <span id="source" class="pill">connecting</span>
    <span id="updated" class="pill"></span>
    <span id="budget" class="pill"></span>
  </header>

  <div class="led-wrap"><canvas id="led" width="704" height="352"></canvas></div>
  <div class="now" id="now"></div>

  <div class="grid">
    <section class="card">
      <h2>Around home</h2>
      <canvas id="radar" width="640" height="640"></canvas>
      <div class="legend">
        <span><span class="dot" style="background:var(--accent)"></span>on screen</span>
        <span><span class="dot" style="background:var(--ok)"></span>passes rules</span>
        <span><span class="dot" style="background:var(--cyan)"></span>cooldown</span>
        <span><span class="dot" style="background:#555"></span>filtered out</span>
      </div>
      <div class="history" id="history"></div>
    </section>
    <section class="card">
      <h2 id="planes-title">Nearby planes</h2>
      <div class="table-wrap">
        <table>
          <thead><tr>
            <th></th><th>Flight</th><th>Airline</th><th>Type</th>
            <th class="num">Dist km</th><th class="num">Alt ft</th><th>Route</th><th>Why</th>
          </tr></thead>
          <tbody id="planes"></tbody>
        </table>
      </div>
    </section>
  </div>
</main>

<script>
// ---- LED panel -----------------------------------------------------------
const W = 64, H = 32, P = 11;
const led = document.getElementById("led").getContext("2d");
const buf = document.createElement("canvas");
buf.width = W; buf.height = H;
const bctx = buf.getContext("2d", { willReadFrequently: true });

function drawLeds(pixels) {
  led.fillStyle = "#050505";
  led.fillRect(0, 0, W * P, H * P);
  for (let y = 0; y < H; y++) {
    for (let x = 0; x < W; x++) {
      const i = (y * W + x) * 4;
      const r = pixels[i], g = pixels[i + 1], b = pixels[i + 2];
      const lit = r + g + b > 0;
      led.fillStyle = lit ? `rgb(${r},${g},${b})` : "#161616";
      led.beginPath();
      led.arc(x * P + P / 2, y * P + P / 2, P * 0.38, 0, Math.PI * 2);
      led.fill();
    }
  }
}

async function frameLoop() {
  try {
    const res = await fetch("/frame.png", { cache: "no-store" });
    if (res.ok) {
      const bmp = await createImageBitmap(await res.blob());
      bctx.drawImage(bmp, 0, 0);
      drawLeds(bctx.getImageData(0, 0, W, H).data);
    }
  } catch (e) { /* app restarting; try again */ }
  setTimeout(frameLoop, 100);
}

// ---- Radar ---------------------------------------------------------------
const radar = document.getElementById("radar").getContext("2d");
const RS = 640, C = RS / 2;

function drawRadar(state) {
  const rules = state.rules;
  const maxKm = Math.max(rules.watchlist.max_distance_km, rules.max_distance_km) * 1.05;
  const k = (C - 16) / maxKm;
  const pos = (km, deg) => {
    const a = (deg - 90) * Math.PI / 180;
    return [C + Math.cos(a) * km * k, C + Math.sin(a) * km * k];
  };
  radar.clearRect(0, 0, RS, RS);
  radar.font = "20px -apple-system, sans-serif";
  radar.textAlign = "center";

  // Rings every 10 km, plus the rules distance highlighted.
  radar.lineWidth = 1.5;
  for (let r = 10; r <= maxKm; r += 10) {
    radar.strokeStyle = "#262a31";
    radar.beginPath(); radar.arc(C, C, r * k, 0, Math.PI * 2); radar.stroke();
    radar.fillStyle = "#4a505a";
    radar.fillText(`${r} km`, C, C - r * k + 20);
  }
  radar.strokeStyle = "rgba(47,191,113,.55)";
  radar.setLineDash([8, 6]);
  radar.beginPath(); radar.arc(C, C, rules.max_distance_km * k, 0, Math.PI * 2); radar.stroke();
  radar.setLineDash([]);
  radar.fillStyle = "#4a505a";
  radar.fillText("N", C, 18);

  for (const lm of state.landmarks) {
    const [x, y] = pos(lm.distance_km, lm.bearing_deg);
    radar.fillStyle = "#6b7280";
    radar.fillRect(x - 5, y - 5, 10, 10);
    radar.fillText(lm.code, x, y + 26);
  }

  radar.fillStyle = "#fff";
  radar.beginPath(); radar.arc(C, C, 6, 0, Math.PI * 2); radar.fill();

  const planes = [...state.planes].sort((a, b) => a.selected - b.selected);
  for (const p of planes) {
    if (p.distance_km > maxKm) continue;
    const [x, y] = pos(p.distance_km, p.bearing_deg);
    const color = p.selected ? "#ffb000" : p.cooldown_s > 0 && p.eligible ? "#33c6ff"
                : p.eligible ? "#2fbf71" : "#555";
    if (p.track_deg != null) {
      const a = (p.track_deg - 90) * Math.PI / 180;
      radar.strokeStyle = color; radar.lineWidth = 2;
      radar.beginPath(); radar.moveTo(x, y);
      radar.lineTo(x + Math.cos(a) * 22, y + Math.sin(a) * 22); radar.stroke();
    }
    radar.fillStyle = color;
    radar.beginPath(); radar.arc(x, y, p.selected ? 9 : 6, 0, Math.PI * 2); radar.fill();
    if (p.eligible || p.selected) {
      radar.fillStyle = p.selected ? "#ffb000" : "#9aa1ab";
      radar.fillText(p.flight_number || p.hex, x, y - 14);
    }
  }
}

// ---- Table & status -----------------------------------------------------
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);

function statusTag(p) {
  if (p.selected) return '<span class="tag shown">on screen</span>';
  if (!p.eligible) return "";
  if (p.tier === "emergency") return '<span class="tag em">emergency</span>';
  if (p.cooldown_s > 0) return `<span class="tag cool">cooldown ${Math.ceil(p.cooldown_s / 60)}m</span>`;
  if (p.tier === "watchlist") return '<span class="tag wl">watchlist</span>';
  return '<span class="tag ok">eligible</span>';
}

function render(state) {
  const src = document.getElementById("source");
  const st = state.source;
  const problem = st.status && st.status !== "NIGHT MODE";
  src.textContent = st.status ? st.status.toLowerCase() : (st.ok ? `${st.mode} data` : `error: ${st.error}`);
  src.className = "pill " + (problem || !st.ok ? "bad" : "ok");
  const ago = st.last_update ? Math.round(state.now - st.last_update) : null;
  const next = st.next_update_in_s;
  const fmt = s => s >= 120 ? `${Math.round(s / 60)} min` : `${s}s`;
  document.getElementById("updated").textContent = ago == null ? "waiting for data"
    : `updated ${fmt(ago)} ago` + (next != null ? ` · next in ${fmt(next)}` : "");
  document.getElementById("budget").textContent =
    st.requests_left_today != null ? `${st.requests_left_today} requests left today` : "";

  const sel = state.selected;
  const selPlane = sel && state.planes.find(p => p.hex === sel.hex);
  document.getElementById("now").innerHTML = sel
    ? `On screen: <b>${esc(selPlane?.flight_number || sel.hex)}</b> · ${esc(sel.why)} · for ${sel.shown_for_s}s`
    : "Nothing matches the rules right now, showing the clock.";

  const eligible = state.planes.filter(p => p.eligible).length;
  document.getElementById("planes-title").textContent =
    `Nearby planes · ${eligible} of ${state.planes.length} pass the rules`;

  document.getElementById("planes").innerHTML = state.planes.map(p => {
    const route = p.origin && p.destination ? `${p.origin.iata || p.origin.icao}→${p.destination.iata || p.destination.icao}` : "";
    const trend = p.vertical_trend === "climbing" ? '<span class="up">▲</span>'
                : p.vertical_trend === "descending" ? '<span class="down">▼</span>' : "";
    const alt = p.on_ground ? "ground" : (p.altitude_ft ?? "");
    const why = p.eligible ? (p.watch_match ? esc(p.watch_match) : "") : esc(p.reasons.join(", "));
    const cls = p.selected ? "selected" : p.eligible ? "" : "rejected";
    return `<tr class="${cls}">
      <td>${statusTag(p)}</td>
      <td>${esc(p.flight_number || p.hex)}</td>
      <td>${esc(p.airline_name || "")}</td>
      <td>${esc(p.type_code || "")}</td>
      <td class="num">${p.distance_km.toFixed(1)}</td>
      <td class="num">${alt} ${trend}</td>
      <td>${esc(route)}</td>
      <td class="why">${why}</td>
    </tr>`;
  }).join("");

  document.getElementById("history").innerHTML = state.history.slice(0, 6).map(h =>
    `<div>${new Date(h.at * 1000).toLocaleTimeString()} · ${esc(h.callsign || h.hex)} shown ${h.shown_s}s, ${esc(h.ended)}</div>`
  ).join("");

  drawRadar(state);
}

async function stateLoop() {
  try {
    const res = await fetch("/state.json", { cache: "no-store" });
    if (res.ok) render(await res.json());
  } catch (e) {
    const src = document.getElementById("source");
    src.textContent = "app not running"; src.className = "pill bad";
  }
  setTimeout(stateLoop, 2000);
}

frameLoop();
stateLoop();
</script>
</body>
</html>
