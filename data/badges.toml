# Hand-drawn 7x7 logo badges. These replace the automatic conversion for the
# listed airlines (ICAO code). Each badge has 7 rows of 7 characters; every
# letter maps to a color in `colors`, "." is black (off).
# `same_as` reuses another airline's badge.
# After editing, run:  python -m planeoverme logos

[AFR]   # Air France: red slash
colors = { R = "#FF1E28" }
pixels = [
  ".....RR",
  "....RRR",
  "...RRR.",
  "..RRR..",
  ".RRR...",
  "RRR....",
  "RR.....",
]

[TVF]   # Transavia: green circle, white t
colors = { G = "#00E070", W = "#FFFFFF" }
pixels = [
  ".GGGGG.",
  "GGWGGGG",
  "GWWWWGG",
  "GGWGGGG",
  "GGWGGGG",
  "GGGWWGG",
  ".GGGGG.",
]

[TRA]
same_as = "TVF"

